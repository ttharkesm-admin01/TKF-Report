# push ขึ้นบรานช์หลัก → เว็บอัปเดตเอง ไม่ต้องสั่งอะไรอีก
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/tkf-report-setup-kd6ejg]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# เผลอ push ติด ๆ กัน ให้ตัวใหม่ชนะ ไม่ต้องรอคิว
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # สร้างรายการรูปจากโฟลเดอร์ที่อยู่ในรีโป
      # ถ้าไม่มีรูปในรีโป จะได้รายการว่าง = สไลด์รูปขึ้นเป็นช่องว่าง (ไม่ error)
      - run: npm run photos

      - run: npm run build
        env:
          # เว็บอยู่ใต้ /TKF-Report ไม่ใช่รากโดเมน ต้องบอก Next ไม่งั้นไฟล์ทั้งหมด 404
          PAGES_BASE_PATH: /TKF-Report

      # enablement: true = เปิด Pages ให้เองถ้ายังไม่ได้เปิด
      # ไม่ต้องเข้าไปตั้งใน Settings ก่อน push ครั้งแรก
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
